name: Build static works

on:
  push:
    branches: [main]
    paths:
      - data/works.json
      - templates/**
      - scripts/build.js
      - assets/works-filter.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Set test-site asset paths
        if: github.repository == 'prhuangstudio-beep/poren-huang-studio-test'
        run: |
          find . -name '*.html' -not -path './node_modules/*' -print0 | xargs -0 sed -i \
            -e 's|<base href="/">|<base href="/poren-huang-studio-test/">|g' \
            -e 's|<base href="../">|<base href="/poren-huang-studio-test/">|g' \
            -e 's|href="/#contact"|href="/poren-huang-studio-test/#contact"|g' \
            -e 's|href="/"|href="/poren-huang-studio-test/"|g'
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add works works.html sitemap.xml index.html about.html
          git diff --cached --quiet || git commit -m "Build static work pages"
          git push
